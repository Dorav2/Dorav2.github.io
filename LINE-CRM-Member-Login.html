<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会员登录 / 注册 / LINE 绑定 Demo | Member Login / Registration / LINE Link Demo</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#e9edf1;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="demoFrame" src="./LINE会员绑定与识别-Demo.html?simple=1&amp;v=compact-9" title="会员登录 / 注册 / LINE 绑定 Demo | Member Login / Registration / LINE Link Demo"></iframe>
  <script>
    const frame=document.getElementById('demoFrame');
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        doc.body.classList.add('simple-mode');
        doc.querySelectorAll('.full-only,.flow-section,.foot').forEach(el=>el.style.display='none');
        doc.querySelectorAll('.simple-only').forEach(el=>el.style.display='block');
        if(frame.contentWindow.go) frame.contentWindow.go('h5entry');
      }catch(e){}
    });
  </script>
</body>
</html>
